services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: menwear_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: menwear_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menwear_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menwear_net

  # ==========================================
  # 2. Redis Cache & Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: menwear_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menwear_net

  # ==========================================
  # 3. MinIO S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: menwear_minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - menwear_net

  # ==========================================
  # 4. Backend NestJS API Server
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: menwear_backend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: menwear_db
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ktd-store-super-secret-jwt-key-production-32chars
      JWT_EXPIRATION: 8h
      JWT_REFRESH_SECRET: ktd-store-super-secret-refresh-jwt-key-32chars
      JWT_REFRESH_EXPIRATION: 7d
      FRONTEND_URL: http://localhost
    networks:
      - menwear_net

  # ==========================================
  # 5. Frontend React SPA (Nginx Server)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: menwear_frontend
    restart: always
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - backend
    networks:
      - menwear_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  menwear_net:
    driver: bridge
